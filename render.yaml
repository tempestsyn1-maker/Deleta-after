services:
  - type: web
    name: beyond-game-sg
    env: node
    region: singapore
    plan: free
    buildCommand: npm install --legacy-peer-deps --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: MIGRATION_ADMIN_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_PASSWORD
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://beyond-game-sg.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: beyond-db-sg
          property: connectionString

databases:
  - name: beyond-db-sg
    region: singapore
    plan: free
    databaseName: beyond
    user: beyond_user
